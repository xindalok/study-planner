<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Tonight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF;
  --panel:#FCF6F8;
  --line:#F9C6D3;
  --line-soft:#FCE4EB;
  --ink:#2B2A5C;
  --muted:#8B86A8;
  --faint:#B39EAC;
  --now:#E24B4A;
  --radius:10px;

  /* subject fills + their own dark text, so labels stay legible on pastel */
  --appdev:#B8E6D5;      --appdev-ink:#0B4436;
  --fund:#C5DEF5;        --fund-ink:#123A5C;
  --cdl:#FBD9A8;         --cdl-ink:#5C3A05;
  --korean:#F9C6D3;      --korean-ink:#72243E;

  /* breaks: solid but deliberately quieter than any subject */
  --rest:#ECE7F1;        --rest-deep:#DFD8E9;
  --rest-line:#D9D0E4;   --rest-ink:#6B6480;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:15px;
  line-height:1.45;
  padding:0 0 72px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:520px;margin:0 auto;padding:0 14px}

/* ---------- header ---------- */
header{padding:20px 0 10px}
.kicker{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin:0 0 4px
}
h1{
  font-family:'Space Grotesk',sans-serif;
  font-size:28px;font-weight:700;letter-spacing:-.02em;
  margin:0 0 2px
}
.sub{color:var(--muted);font-size:13px;margin:0}

/* ---------- day chips (the reference's coloured headers, doubling as nav) ---------- */
.days{display:flex;gap:6px;padding:14px 0 4px}
.day-tab{
  flex:1 1 0;min-width:0;
  border:2px solid transparent;border-radius:9px;
  padding:7px 4px;cursor:pointer;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;line-height:1.3;font-weight:500;
  text-align:center;white-space:nowrap;overflow:hidden;
  transition:transform .12s,filter .12s;
}
.day-tab b{display:block;font-size:13px;font-weight:600}
.day-tab[aria-selected="true"]{border-color:var(--ink)}
.day-tab.past{opacity:.45}
.day-tab:active{transform:scale(.97)}
.dow-1{background:#C8E6D0;color:#1B4A2C}
.dow-2{background:#D8CCEE;color:#3C3489}
.dow-3{background:#F7CFE1;color:#72243E}
.dow-4{background:#F5C99B;color:#5C3A05}
.dow-5{background:#F7C15E;color:#4A3405}
.dow-6{background:#CFEAF7;color:#0C4453}
.dow-0{background:#A9DCE8;color:#0C4453}

/* ---------- start time ---------- */
.startbar{
  display:flex;align-items:center;gap:10px;
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:9px 12px;margin:12px 0 2px
}
.startbar[hidden]{display:none}
.startbar label{font-size:12px;color:var(--muted);flex:1}
.startbar input{
  background:var(--paper);border:1px solid var(--line);color:var(--ink);
  font-family:'JetBrains Mono',monospace;font-size:14px;
  /* wide enough for a 12-hour locale's AM/PM segment, which was being
     clipped — 07:30 with no meridiem is ambiguous */
  border-radius:6px;padding:5px 8px;width:140px
}

/* ---------- the rail ---------- */
/* The rail is a fixed time canvas: every half hour of the window is drawn,
   whether or not anything is scheduled in it. Blocks are positioned by clock
   time, so heights must be strictly proportional to duration or they would
   drift off the gridlines. */
.rail{position:relative;margin:16px 0 0;padding-left:48px}
/* Gridlines sit BEHIND the blocks, so they rule the empty grid you can drop
   into and stop where a block starts. They were briefly drawn on top to fix
   apparent misalignment, but the real cause of that was the label floating
   above its line — fixed by centring it below — and lines cutting across every
   block just made the column noisy. */
.gridline{
  position:absolute;left:0;right:0;height:1px;
  background:rgba(249,198,211,.55);
  pointer-events:none;z-index:0
}
.gridline.hour{background:rgba(233,150,175,.85)}
/* centred on the line rather than floating 7px above it */
.gridline span{
  position:absolute;left:0;top:0;transform:translateY(-50%);
  width:40px;text-align:right;line-height:1;
  font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);
  letter-spacing:-.02em
}
.gridline.hour span{color:var(--muted);font-weight:600}
/* the gutter portion is opaque so labels never sit on top of a block edge */
.gridline::before{
  content:'';position:absolute;left:0;width:48px;top:-6px;height:13px;
  background:var(--paper)
}

/* A group is one focus block plus the break that follows it. Groups are what
   you drag; the break travels with its block. */
/* above the gridlines regardless of DOM order, so lines never cross a block */
.group{position:absolute;left:48px;right:0;z-index:1}
.block{
  position:relative;display:flex;align-items:stretch;touch-action:pan-y
}
.body{
  flex:1;border-radius:6px;
  display:flex;align-items:center;gap:8px;padding:2px 8px;
  overflow:hidden;border:1px solid transparent
}
.block.focus .body{cursor:pointer}
.block[data-subject="Vibecode App Dev"] .body{background:var(--appdev);color:var(--appdev-ink)}
.block[data-subject="Fundamentals (JS/React)"] .body{background:var(--fund);color:var(--fund-ink)}
.block[data-subject="Digital Cloud Leader"] .body{background:var(--cdl);color:var(--cdl-ink)}
.block[data-subject="Korean"] .body{background:var(--korean);color:var(--korean-ink)}

/* Breaks are solid blocks, not gaps. A transparent dashed outline read as
   empty space, which made the column hard to parse. Quieter than the subject
   pastels so focus blocks still dominate. */
.block.break .body{
  background:var(--rest);border:1px solid var(--rest-line);color:var(--rest-ink);
  padding:0 8px
}
.block.long_break .body{background:var(--rest-deep)}
.block.break .label{font-size:11px;font-weight:500;line-height:1}
.block.break .meta{font-size:10px;opacity:.8}

/* blocked-out time: not study, not a break — hatched so it reads as unavailable */
.block.blocked .body{
  background:repeating-linear-gradient(135deg,
    #EEEAEF 0 7px, #E2DCE4 7px 14px);
  border:1px solid #CFC6D2;color:#5F5768;cursor:pointer;padding:0 8px
}
.block.blocked .label{font-size:11px;font-weight:500;line-height:1}
.block.blocked .meta{font-size:10px;opacity:.8}

/* tap-empty-grid affordance */
.slotpick{
  position:absolute;left:48px;right:0;z-index:30;
  background:var(--paper);border:1px solid var(--ink);border-radius:8px;
  padding:7px 8px;display:flex;gap:6px;align-items:center;
  box-shadow:0 6px 20px rgba(43,42,92,.18)
}
.slotpick b{
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;
  color:var(--ink);margin-right:2px;flex:0 0 auto
}
.slotpick button{
  flex:1 1 0;background:var(--panel);border:1px solid var(--line);color:var(--ink);
  border-radius:6px;padding:6px 0;font-size:12px;font-family:inherit;cursor:pointer
}
.slotpick button:active{background:#F7E9EE}
.slotpick button.x{flex:0 0 auto;padding:6px 9px;color:var(--muted)}

/* live readout of the delay while dragging */
.grip[data-hint]::after{
  content:attr(data-hint);position:absolute;right:48px;
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;
  color:var(--ink);background:#fff;border:1px solid var(--line);
  border-radius:6px;padding:2px 6px;white-space:nowrap
}
.grip{position:relative}

/* label stacked over its clock range; taking the range out of the horizontal
   run also gives the task name more width before it truncates */
.text{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.label{font-size:13px;font-weight:500;letter-spacing:-.01em;line-height:1.25;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-family:'JetBrains Mono',monospace;font-size:10px;opacity:.72;
  line-height:1.25;white-space:nowrap}

/* short blocks have no room to stack, so they read as a single row */
.block.break .text,
.block.blocked .text{flex-direction:row;align-items:center;gap:8px}
.block.break .meta,
.block.blocked .meta{margin-left:auto;flex:0 0 auto}

.tick{
  flex:0 0 auto;width:18px;height:18px;border-radius:5px;
  border:1.5px solid currentColor;opacity:.4;
  display:grid;place-items:center
}
.tick svg{width:11px;height:11px;stroke:currentColor;stroke-width:3;fill:none;opacity:0}
.block.done .tick{opacity:1;background:rgba(255,255,255,.55)}
.block.done .tick svg{opacity:1}
.block.done .body{filter:saturate(.45)}
.block.done .label{text-decoration:line-through;text-decoration-thickness:1px;opacity:.7}

/* drag grip */
/* 44px wide is the smallest comfortable touch target. Only focus blocks have
   a grip, and those are 45px tall, so the handle is a full 44x45. touch-action
   is none here only — the block keeps pan-y so the page still scrolls. */
.grip{
  flex:0 0 auto;width:44px;align-self:stretch;cursor:grab;
  display:grid;place-items:center;touch-action:none;
  margin:0 -8px 0 0;border-radius:0 6px 6px 0;
  background:rgba(43,42,92,.06)
}
.grip:active{cursor:grabbing;background:rgba(43,42,92,.14)}
.grip span{
  display:block;width:14px;height:2px;border-radius:2px;
  background:currentColor;opacity:.5;
  box-shadow:0 -5px 0 currentColor,0 5px 0 currentColor
}
.group.dragging{z-index:20}
.group.dragging .body{box-shadow:0 8px 22px rgba(43,42,92,.22);border-color:var(--ink)}
/* No transition while a drag is live. Previously .reordering put a 160ms ease
   on transform, and transform is rewritten on every pointermove — so each
   move started a fresh animation and the blocks lagged behind the finger. */
.rail.reordering .group{transition:none}
/* dimmed while the save is in flight, with the dragged position held */
.rail.saving{opacity:.6;pointer-events:none;transition:opacity .12s}

/* now marker */
.nowline{
  position:absolute;left:0;right:0;height:2px;background:var(--now);
  pointer-events:none;z-index:10
}
.nowline::before{
  content:'';position:absolute;left:44px;top:-4px;
  width:9px;height:9px;border-radius:50%;background:var(--now)
}
/* right-aligned: in the gutter it sat on top of the half-hour label whenever
   the current time was near one, which is most of the time */
.nowline span{
  position:absolute;right:2px;top:-6px;
  font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--now);
  letter-spacing:.06em;font-weight:600;
  background:var(--paper);padding:0 3px;border-radius:3px
}

/* ---------- footer / states ---------- */
.summary{
  display:flex;gap:14px;margin:18px 0 0;padding-top:12px;
  border-top:1px solid var(--line);font-size:12px;color:var(--muted);
  font-family:'JetBrains Mono',monospace;flex-wrap:wrap
}
.summary b{color:var(--ink);font-weight:600}
.summary .warn{color:#A33B3A;font-weight:600}
.actions{display:flex;gap:8px;margin-top:14px}
button.ghost{
  background:var(--panel);border:1px solid var(--line);color:var(--muted);
  border-radius:8px;padding:9px 14px;font-size:13px;cursor:pointer;
  font-family:inherit
}
button.ghost:active{background:#F7E9EE}
/* the only visible sign a delay exists, so give it some weight */
button.ghost.warn{
  background:#FBEBEA;border-color:rgba(226,75,74,.4);color:#A33B3A;font-weight:500
}
button.ghost.warn:active{background:#F7DDDC}
.msg{
  padding:26px 16px;text-align:center;color:var(--muted);font-size:14px;
  border:1px dashed var(--line);border-radius:var(--radius);margin-top:18px
}
.toast{
  position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(90px);
  background:var(--ink);color:#fff;
  padding:9px 16px;border-radius:999px;font-size:13px;
  transition:transform .22s cubic-bezier(.2,.8,.3,1);z-index:100
}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ---------- break timer + mute ---------- */
.mute{
  margin-left:auto;flex:0 0 auto;width:42px;height:38px;
  border-radius:8px;background:var(--panel);border:1px solid var(--line);
  display:grid;place-items:center;cursor:pointer;padding:0
}
.mute svg{width:20px;height:20px;stroke:var(--muted);stroke-width:1.8;
  fill:none;stroke-linecap:round;stroke-linejoin:round}
.mute[aria-pressed="true"]{background:#FBEBEA;border-color:rgba(226,75,74,.4)}
.mute[aria-pressed="true"] svg{stroke:#A33B3A}

.breaktimer{
  position:fixed;left:14px;right:14px;bottom:14px;z-index:120;
  display:flex;align-items:center;gap:10px;
  background:var(--rest-deep);border:1px solid var(--rest-line);
  border-radius:12px;padding:9px 10px 9px 13px;
  box-shadow:0 6px 20px rgba(43,42,92,.16)
}
.breaktimer[hidden]{display:none}
.bt-label{flex:1;min-width:0;line-height:1.25}
.bt-label b{display:block;font-size:13px;font-weight:600;color:var(--ink)}
.bt-label span{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--rest-ink)}
.bt-left{
  font-family:'JetBrains Mono',monospace;font-size:19px;font-weight:600;
  color:var(--ink);flex:0 0 auto;letter-spacing:-.02em
}
.bt-x{
  flex:0 0 auto;width:30px;height:30px;border-radius:8px;
  background:transparent;border:1px solid var(--rest-line);color:var(--rest-ink);
  font-size:13px;cursor:pointer;padding:0
}
.bt-x:active{background:rgba(43,42,92,.06)}
@media (max-width:400px){ .bt-label span{display:none} }
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="kicker" id="kicker">Study planner</p>
    <h1 id="title">Loading</h1>
    <p class="sub" id="subtitle">Fetching your schedule…</p>
  </header>

  <div class="days" id="days" role="tablist"></div>

  <div class="startbar" id="startbar" hidden>
    <label for="startInput" id="startLabel">Start time</label>
    <input type="time" id="startInput">
  </div>

  <div id="content"></div>
</div>

<div class="toast" id="toast"></div>

<div class="breaktimer" id="breaktimer" hidden>
  <div class="bt-label">
    <b id="btName">Short break</b>
    <span id="btEnds"></span>
  </div>
  <div class="bt-left" id="btLeft">00:00</div>
  <button class="bt-x" id="btDismiss" aria-label="Dismiss break timer">✕</button>
</div>


<script>
// ---------------------------------------------------------------- config
// No URL and no key. This page is served by the Apps Script project itself,
// and google.script.run calls back into it over an already-authenticated
// channel — Google has verified the caller is the owner before the page loads.

// doGet inlines the schedule here, so the timetable renders immediately with
// no network round trip. null only if the server hit an error building it.
const BOOTSTRAP = <?!= bootstrap ?>;

// whether the daily trigger is installed — shown in the footer so a silent
// failure to install it is visible rather than discovered weeks later
const TRIGGER_OK = <?!= trigger ?>;

// 1.5px/min keeps the whole evening on one screen — at 2px/min the second
// subject fell below the fold. Breaks are 15px, which is legible now that they
// have a solid fill. Heights stay strictly proportional to the gridlines.
const PX_PER_MIN = 1.5;

// Mute lives up here because render() builds the button and runs during boot,
// before the timer section below would have initialised these.
let muted = false;
try { muted = localStorage.getItem('planner.muted') === '1'; } catch(e){}
const BELL = '<path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>'
           + '<path d="M13.7 21a2 2 0 0 1-3.4 0"/>';
const BELL_OFF = BELL + '<path d="M3 3l18 18"/>';

// The visible window per day type. Times after midnight are written as they
// read on a clock; toMin() rolls them past 24h so the canvas stays continuous.
const CANVAS = {
  weekday:  { from:'18:30', to:'01:00' },
  saturday: { from:'10:00', to:'00:30' },
  sunday:   { from:'10:00', to:'00:30' }
};

const toMin = hhmm => {
  const [h,m] = hhmm.split(':').map(Number);
  return h*60 + m;
};
const fmtMin = t => {
  const h = Math.floor(t/60) % 24, m = t % 60;
  return ('0'+h).slice(-2) + ':' + ('0'+m).slice(-2);
};

/**
 * Absolute minute positions for a day, measured on a continuous line that
 * runs past midnight rather than wrapping. The server sends 'HH:mm' strings
 * that have already wrapped (23:40 then 00:10), so positions are recomputed
 * here from the day's start plus cumulative durations instead of parsed back.
 */
function layout(day){
  const c = CANVAS[day.dayType] || CANVAS.weekday;
  let from = toMin(c.from);
  let to = toMin(c.to);
  if(to <= from) to += 1440;               // window crosses midnight

  let cursor = toMin(day.startTime);
  if(cursor < from) cursor += 1440;        // shouldn't happen, but stay ordered
  const placed = day.blocks.map(b => {
    const at = cursor;
    cursor += b.duration;
    return { block:b, from:at, to:cursor };
  });

  // never clip: if a delay pushes the evening past the window, grow it
  const end = placed.length ? placed[placed.length-1].to : to;
  return { from:from, to:Math.max(to, Math.ceil(end/30)*30), placed:placed };
}

// ---------------------------------------------------------------- state
let state = { days: [], today: null, settings: {}, selected: null };

const $ = id => document.getElementById(id);
const content = $('content');

function toast(text){
  const t = $('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove('show'), 1800);
}

// ---------------------------------------------------------------- api
/**
 * google.script.run is callback-based, so wrap it in a promise. Server
 * functions throw on failure, which lands in withFailureHandler — hence the
 * {ok,data,error} shape the callers already use.
 */
function call(fn, ...args){
  return new Promise(resolve => {
    google.script.run
      .withSuccessHandler(data => resolve({ok:true, data:data}))
      .withFailureHandler(err => resolve({ok:false, error:String(err && err.message || err)}))
      [fn](...args);
  });
}

const apiGet  = () => call('apiRead');
const apiPost = payload => {
  switch(payload.action){
    case 'setDone':  return call('apiSetDone', payload.id, payload.done);
    case 'reorder':  return call('apiReorder', payload.date, payload.orderedIds);
    case 'setStart': return call('apiSetStart', payload.field, payload.value);
    case 'replan':   return call('apiReplan', payload.date);
    case 'setDelay': return call('apiSetDelay', payload.date, payload.id, payload.minutes);
    case 'clearDelays': return call('apiClearDelays', payload.date);
    case 'blockOut':  return call('apiBlockOut', payload.date, payload.beforeId, payload.minutes);
    case 'unblock':   return call('apiUnblock', payload.date, payload.id);
    default:         return Promise.resolve({ok:false, error:'unknown action'});
  }
};

// ---------------------------------------------------------------- render
function dayById(id){ return state.days.find(d => d.date === id); }

function blockHeight(b){
  return b.duration * PX_PER_MIN;
}

const isBreak = k => k === 'short_break' || k === 'long_break';

/**
 * A focus block and the break immediately after it form one group, so a delay
 * applied to a study slot carries its break along. A 'gap' is never absorbed
 * into a group — it is the delay itself, and sits before the block it pushes.
 */
function buildGroups(blocks){
  const groups = [];
  for(let i = 0; i < blocks.length; i++){
    const g = [blocks[i]];
    if(blocks[i].kind === 'focus' && blocks[i+1] && isBreak(blocks[i+1].kind)){
      g.push(blocks[i+1]);
      i++;
    }
    groups.push(g);
  }
  return groups;
}

/** Minutes of gap sitting immediately before this block, 0 if none. */
function gapBefore(blocks, id){
  const i = blocks.findIndex(b => b.id === id);
  if(i > 0 && blocks[i-1].kind === 'gap') return blocks[i-1].duration;
  return 0;
}

function renderTabs(){
  const el = $('days');
  el.innerHTML = '';
  state.days.forEach(d => {
    const dow = new Date(d.date + 'T00:00:00').getDay();
    const b = document.createElement('button');
    b.className = 'day-tab dow-' + dow + (d.date < state.today ? ' past' : '');
    b.setAttribute('role','tab');
    b.setAttribute('aria-selected', String(d.date === state.selected));
    const name = d.weekday.slice(0,3).toUpperCase();
    b.innerHTML = name + '<b>' + Number(d.date.slice(8,10)) + '</b>';
    b.onclick = () => { state.selected = d.date; render(); };
    el.appendChild(b);
  });
}

function renderHeader(day){
  const isToday = day.date === state.today;
  $('kicker').textContent = day.dayType === 'saturday' ? 'Saturday · App Dev only'
    : day.dayType === 'sunday' ? 'Sunday' : 'Weekday';
  $('title').textContent = isToday ? 'Tonight' : day.label;
  const focus = day.blocks.filter(b => b.kind === 'focus');
  const subs = [...new Set(focus.map(b => b.subject))];
  const mins = focus.reduce((a,b)=>a+b.duration,0);
  $('subtitle').textContent = subs.join(' + ') + ' · ' + (mins/60) + 'h of focus';
}

function renderStartBar(day){
  const bar = $('startbar');
  const input = $('startInput');
  const field = day.dayType === 'saturday' ? 'saturdayStart'
    : day.dayType === 'sunday' ? 'sundayStart' : 'weekdayStart';
  bar.hidden = false;
  $('startLabel').textContent =
    field === 'weekdayStart' ? 'Weekdays start at'
    : field === 'saturdayStart' ? 'Saturdays start at' : 'Sundays start at';
  input.value = day.startTime;
  input.onchange = async () => {
    const v = input.value;
    toast('Saving start time…');
    const r = await apiPost({action:'setStart', field: field, value: v});
    if(r.ok){ absorb(r.data); render(); toast('Day starts at ' + v); }
    else toast('Could not save');
  };
}

function blockEl(b, editable){
  const el = document.createElement('div');
  // also carry the exact kind, so long breaks can read differently from short
  el.className = 'block ' + (b.kind === 'focus' ? 'focus' : 'break')
    + ' ' + b.kind + (b.done ? ' done' : '');
  el.dataset.id = b.id;
  if(b.subject) el.dataset.subject = b.subject;
  el.style.height = blockHeight(b) + 'px';

  const body = document.createElement('div');
  body.className = 'body';

  if(b.kind === 'focus'){
    const tick = document.createElement('div');
    tick.className = 'tick';
    tick.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="4 13 9 18 20 6"/></svg>';
    body.appendChild(tick);
  }

  // task on one line, its actual clock range under it — a 30-min block is 45px,
  // which fits both. Breaks are 15px, so their text lays out in a row instead.
  const text = document.createElement('div');
  text.className = 'text';

  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = b.task;
  text.appendChild(label);

  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.textContent = b.start + '–' + b.end + '  ·  ' + b.duration + 'm';
  text.appendChild(meta);

  body.appendChild(text);

  // tap a blocked slot to give the time back
  if(b.kind === 'blocked' && editable){
    body.setAttribute('role','button');
    body.setAttribute('aria-label','Remove blocked time');
    body.onclick = async () => {
      toast('Removing…');
      const r = await apiPost({action:'unblock', date: b._date, id: b.id});
      if(r.ok){ absorb(r.data); render(); toast('Time freed'); }
      else toast('Could not remove');
    };
  }

  // Whole block is the check target — a 18px checkbox is a poor tap target,
  // and there is room now that each block is at least 44px tall.
  if(b.kind === 'focus'){
    body.setAttribute('role','button');
    body.setAttribute('tabindex','0');
    body.setAttribute('aria-label', (b.done ? 'Mark not done: ' : 'Mark done: ') + b.task);
    const toggle = async () => {
      const next = !el.classList.contains('done');
      // update the model and the counter immediately; the round trip to Apps
      // Script takes about a second and the UI should not wait on it
      el.classList.toggle('done', next);
      b.done = next;
      refreshSummary();
      const r = await apiPost({action:'setDone', id:b.id, done:next});
      if(!r.ok){
        el.classList.toggle('done', !next);
        b.done = !next;
        refreshSummary();
        toast('Could not save');
      }
    };
    body.onclick = e => { if(!e.target.closest('.grip')) toggle(); };
    body.onkeydown = e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); } };
  }

  // Only focus blocks get a grip. Breaks are carried by the block above them,
  // so an independent break handle would just be a way to break the pairing.
  if(editable && b.kind === 'focus'){
    const grip = document.createElement('div');
    grip.className = 'grip';
    grip.setAttribute('aria-label','Drag to reorder ' + b.task + ' and its break');
    grip.innerHTML = '<span></span>';
    body.appendChild(grip);
  }

  el.appendChild(body);
  return el;
}

/**
 * Heights are strictly proportional now, so the marker is placed straight from
 * the clock rather than interpolated inside a block — it is exact.
 */
function renderNowLine(rail, day){
  if(!day || day.date !== state.today) return;
  const L = layout(day);
  const now = new Date();
  let mins = now.getHours()*60 + now.getMinutes();
  if(mins < L.from) mins += 1440;            // early hours belong to last night
  if(mins < L.from || mins > L.to) return;

  const line = document.createElement('div');
  line.className = 'nowline';
  line.innerHTML = '<span>NOW</span>';
  line.style.top = ((mins - L.from) * PX_PER_MIN) + 'px';
  rail.appendChild(line);
}

function summaryHTML(day){
  const focus = day.blocks.filter(b=>b.kind==='focus');
  const done = focus.filter(b=>b.done).length;
  return '<div><b>' + done + '/' + focus.length + '</b> done</div>' +
    '<div><b>' + (done*30/60).toFixed(1) + 'h</b> logged</div>' +
    '<div>ends <b>' + day.blocks[day.blocks.length-1].end + '</b></div>' +
    (TRIGGER_OK ? '' : '<div class="warn">daily trigger not installed</div>');
}

function renderSummary(day){
  const div = document.createElement('div');
  div.className = 'summary';
  div.id = 'summary';
  div.innerHTML = summaryHTML(day);
  return div;
}

/** Keep the counter honest after a check-off, without a full re-render. */
function refreshSummary(){
  const el = $('summary');
  const day = dayById(state.selected);
  if(el && day) el.innerHTML = summaryHTML(day);
}

/**
 * Sound toggle, built fresh each render so it can live in the actions row —
 * render() clears #content, so a long-lived element there would go stale.
 * Toggling repaints in place rather than re-rendering the whole day.
 */
function muteButton(){
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'mute';
  b.title = 'Sound on/off';
  const paint = () => {
    b.setAttribute('aria-pressed', String(muted));
    b.setAttribute('aria-label', muted ? 'Unmute chimes' : 'Mute chimes');
    b.innerHTML = '<svg viewBox="0 0 24 24">' + (muted ? BELL_OFF : BELL) + '</svg>';
  };
  b.onclick = () => {
    muted = !muted;
    try { localStorage.setItem('planner.muted', muted ? '1' : '0'); } catch(e){}
    paint();
    toast(muted ? 'Chimes muted' : 'Chimes on');
  };
  paint();
  return b;
}

function render(){
  const day = dayById(state.selected) || dayById(state.today) || state.days[0];
  if(!day){
    content.innerHTML = '<div class="msg">No schedule yet. Run firstTimeSetup in Apps Script, then refresh.</div>';
    return;
  }
  state.selected = day.date;
  renderTabs();
  renderHeader(day);
  renderStartBar(day);

  content.innerHTML = '';
  const rail = document.createElement('div');
  rail.className = 'rail';
  rail.id = 'rail';
  rail.dataset.date = day.date;

  const editable = day.date >= state.today;
  const L = layout(day);
  rail.style.height = ((L.to - L.from) * PX_PER_MIN) + 'px';

  // index each block's placement so a group can be positioned by clock time
  const at = {};
  L.placed.forEach(p => { at[p.block.id] = p; });

  // Gaps are not drawn. They still count in layout() above, so the blocks
  // after a delay sit later on the canvas — the delay shows as empty grid
  // rather than as a block of its own.
  day.blocks.forEach(b => { b._date = day.date; });   // blocked slots need it to unblock

  buildGroups(day.blocks.filter(b => b.kind !== 'gap')).forEach(group => {
    const g = document.createElement('div');
    g.className = 'group';
    g.style.top = ((at[group[0].id].from - L.from) * PX_PER_MIN) + 'px';
    group.forEach(b => g.appendChild(blockEl(b, editable)));

    // dragging the grip delays this group and everything below it
    const grip = g.querySelector('.grip');
    if(grip){
      const lead = group[0];
      attachDelay(grip, g, day.date, lead.id,
        gapBefore(day.blocks, lead.id), at[lead.id].from);
    }
    rail.appendChild(g);
  });

  // drawn last so they sit above the blocks — every half hour of the window,
  // scheduled or not
  for(let t = L.from; t <= L.to; t += 30){
    const line = document.createElement('div');
    line.className = 'gridline' + (t % 60 === 0 ? ' hour' : '');
    line.style.top = ((t - L.from) * PX_PER_MIN) + 'px';
    line.innerHTML = '<span>' + fmtMin(t) + '</span>';
    rail.appendChild(line);
  }
  if(editable) attachSlotPicker(rail, day, L);
  content.appendChild(rail);
  renderNowLine(rail, day);
  content.appendChild(renderSummary(day));

  const actions = document.createElement('div');
  actions.className = 'actions';

  // Delays aren't drawn, so this button is the only sign one exists — and the
  // only easy way out of it. Shown only when the day actually has one.
  const delayed = day.blocks.filter(b => b.kind === 'gap');
  if(editable && delayed.length){
    const mins = delayed.reduce((a,b) => a + b.duration, 0);
    const cb = document.createElement('button');
    cb.className = 'ghost warn';
    cb.textContent = 'Clear ' + mins + 'm delay';
    cb.onclick = async () => {
      toast('Clearing…');
      const r = await apiPost({action:'clearDelays', date:day.date});
      if(r.ok){ absorb(r.data); render(); toast('Delay cleared'); }
      else toast('Could not clear');
    };
    actions.appendChild(cb);
  }

  if(editable){
    const rb = document.createElement('button');
    rb.className = 'ghost';
    rb.textContent = 'Reset this day';
    rb.onclick = async () => {
      if(!confirm('Rebuild this day from the template? Check-offs and order are cleared.')) return;
      toast('Rebuilding…');
      const r = await apiPost({action:'replan', date:day.date});
      if(r.ok){ absorb(r.data); render(); toast('Day rebuilt'); }
      else toast('Could not rebuild');
    };
    actions.appendChild(rb);
  }
  const refresh = document.createElement('button');
  refresh.className = 'ghost';
  refresh.textContent = 'Refresh';
  refresh.onclick = load;
  actions.appendChild(refresh);

  actions.appendChild(muteButton());   // right edge of the same row
  content.appendChild(actions);
}

// ---------------------------------------------------------------- drag to reorder
/**
 * Tap empty grid to reserve that time. The blocked slot is inserted before the
 * first block starting at or after the tapped time, so everything from there
 * shifts later — the same sequencing every other block kind uses.
 *
 * It therefore lands on that block's boundary rather than the exact minute you
 * tapped. Storing a real start time per block would be needed for exact
 * placement, and that would break the "times are always derived" design.
 */
function attachSlotPicker(rail, day, L){
  let pick = null;
  const close = () => { if(pick){ pick.remove(); pick = null; } };

  rail.addEventListener('click', e => {
    if(e.target.closest('.group')){ close(); return; }   // tapped a block
    if(e.target.closest('.slotpick')) return;
    close();

    const y = e.clientY - rail.getBoundingClientRect().top;
    const at = L.from + Math.round((y / PX_PER_MIN) / 30) * 30;

    // first block at or after the tapped time; none means end of day
    let beforeId = '';
    for(const p of L.placed){
      if(p.from >= at){ beforeId = p.block.id; break; }
    }

    pick = document.createElement('div');
    pick.className = 'slotpick';
    pick.style.top = Math.max(0, (at - L.from) * PX_PER_MIN) + 'px';
    pick.innerHTML = '<b>' + fmtMin(at) + '</b>';

    [['30m',30],['1h',60],['2h',120]].forEach(([label,mins]) => {
      const b = document.createElement('button');
      b.textContent = label;
      b.onclick = async ev => {
        ev.stopPropagation();
        close();
        toast('Blocking out ' + label + '…');
        const r = await apiPost({action:'blockOut', date: day.date,
          beforeId: beforeId, minutes: mins});
        if(r.ok){ absorb(r.data); render(); toast('Time blocked out'); }
        else toast('Could not block out');
      };
      pick.appendChild(b);
    });

    const x = document.createElement('button');
    x.className = 'x';
    x.textContent = '✕';
    x.setAttribute('aria-label','Cancel');
    x.onclick = ev => { ev.stopPropagation(); close(); };
    pick.appendChild(x);

    rail.appendChild(pick);
  });
}

const SNAP_MIN = 5;   // delays land on 5-minute boundaries

/**
 * Drag the grip to delay this group and everything below it. Blocks above are
 * never touched — they keep their transforms at zero throughout.
 *
 * The DOM is deliberately not mutated while dragging. An earlier version
 * called insertBefore() mid-drag, which detaches the dragged subtree —
 * including the grip holding pointer capture — and removing a capturing
 * element releases the capture, so pointermove stopped firing. Here everything
 * is previewed with transforms and committed once on release, and the
 * listeners live on window so nothing depends on capture surviving.
 */
function attachDelay(grip, el, date, blockId, currentGap, startsAt){
  let rail=null, below=[], startY=0, mins=currentGap, moved=false;

  // Drag distance converts to minutes at the same scale the blocks are drawn,
  // then snaps. Clamped at zero: you can drag up to cancel a delay, but a
  // block can never start earlier than its natural place in the day.
  const minutesFor = dy =>
    Math.max(0, Math.round((currentGap + dy / PX_PER_MIN) / SNAP_MIN) * SNAP_MIN);

  const onMove = e => {
    const dy = e.clientY - startY;
    if(Math.abs(dy) > 4) moved = true;
    mins = minutesFor(dy);
    const px = (mins - currentGap) * PX_PER_MIN;
    // translate3d keeps this on the compositor instead of relayout per move
    below.forEach(n => { n.style.transform = 'translate3d(0,' + px + 'px,0)'; });
    // now that the grid shows real hours, the useful readout is the clock
    // time this block would land on, not the size of the delay
    grip.dataset.hint = fmtMin(startsAt - currentGap + mins);
  };

  const onUp = async () => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);

    el.classList.remove('dragging');
    rail.classList.remove('reordering');
    delete grip.dataset.hint;

    const reset = () => below.forEach(n => {
      n.style.transform = ''; n.style.willChange = '';
    });

    if(!moved || mins === currentGap){ reset(); return; }

    // Hold the dragged position while the save is in flight. Clearing it here
    // made the whole schedule snap back to its old times for the length of the
    // round trip and then jump forward again once the re-render landed.
    rail.classList.add('saving');
    const r = await apiPost({action:'setDelay', date: date, id: blockId, minutes: mins});
    if(r.ok){
      absorb(r.data);
      render();                       // rebuilds the rail, so transforms go with it
      toast(mins ? 'Pushed back ' + mins + 'm' : 'Delay cleared');
    } else {
      rail.classList.remove('saving');
      reset();
      toast('Could not save');
      load();
    }
  };

  grip.addEventListener('pointerdown', e => {
    e.preventDefault();
    e.stopPropagation();
    rail = el.parentElement;
    const groups = [...rail.children].filter(n => n.classList.contains('group'));
    const i = groups.indexOf(el);
    if(i < 0) return;
    below = groups.slice(i);   // this group and everything after it, only
    below.forEach(n => { n.style.willChange = 'transform'; });
    startY = e.clientY;
    mins = currentGap;
    moved = false;
    el.classList.add('dragging');
    rail.classList.add('reordering');
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  });
}

// ---------------------------------------------------------------- boot
function absorb(data){
  state.days = data.days;
  state.today = data.today;
  state.settings = data.settings;
  if(!state.selected) state.selected = data.today;
}

async function load(){
  try{
    const r = await apiGet();
    if(!r.ok){ content.innerHTML = '<div class="msg">' + r.error + '</div>'; return; }
    absorb(r.data);
    render();
  }catch(err){
    content.innerHTML = '<div class="msg">Couldn\'t refresh: ' + err + '</div>';
  }
}

// First paint comes from the inlined data — no waiting on the network.
// load() is only for the Refresh button and for the error fallback.
if(BOOTSTRAP && BOOTSTRAP.days){
  absorb(BOOTSTRAP);
  render();
}else{
  load();
}

setInterval(() => {
  const r = $('rail');
  if(!r) return;
  const d = dayById(state.selected);
  const old = r.querySelector('.nowline');
  if(old) old.remove();
  renderNowLine(r, d);
}, 60000);

// ---------------------------------------------------------------- break timer
/**
 * Counts down whatever break is running right now, and chimes once when one
 * starts. Only works while this page is open — a web page cannot alert you
 * after it is closed. The Telegram bot would be the way to get that.
 *
 * Mute is remembered in localStorage, with an in-memory fallback because the
 * Apps Script sandbox can refuse storage access.
 */
// Two short tones via Web Audio — no asset to load, nothing for CSP to block.
function chime(){
  if(muted) return;
  try{
    const AC = window.AudioContext || window.webkitAudioContext;
    if(!AC) return;
    const ctx = new AC();
    const t0 = ctx.currentTime;
    [[0,660],[0.18,880]].forEach(([at,hz]) => {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = hz;
      gain.gain.setValueAtTime(0.0001, t0 + at);
      gain.gain.exponentialRampToValueAtTime(0.22, t0 + at + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + at + 0.17);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(t0 + at); osc.stop(t0 + at + 0.2);
    });
    setTimeout(() => { try { ctx.close(); } catch(e){} }, 900);
  }catch(e){}
}

let activeBlock = null;      // id of whatever block is running right now
let primed = false;          // first tick only records position — see below
let dismissed = null;        // id the user dismissed, so it stays hidden

$('btDismiss').onclick = () => {
  dismissed = activeBlock;
  $('breaktimer').hidden = true;
};

function pad(n){ return (n < 10 ? '0' : '') + n; }

function tickTimer(){
  const day = dayById(state.today);
  if(!day){ $('breaktimer').hidden = true; return; }

  const L = layout(day);
  const now = new Date();
  let mins = now.getHours()*60 + now.getMinutes() + now.getSeconds()/60;
  if(mins < L.from) mins += 1440;      // after-midnight blocks belong to tonight

  let cur = null;
  for(const p of L.placed){
    if(mins >= p.from && mins < p.to){ cur = p; break; }
  }
  const id = cur ? cur.block.id : null;

  if(id !== activeBlock){
    // The very first tick must not chime: opening the app in the middle of a
    // block is not the block starting, and it would sound on every reload.
    const wasPrimed = primed;
    activeBlock = id;
    if(wasPrimed && cur && (cur.block.kind === 'focus' || isBreak(cur.block.kind))){
      chime();                         // a study block or a break just began
    }
  }
  // Primed after ANY tick, not just one that changed block. Opening the app
  // before the day starts leaves activeBlock null with no change to observe,
  // and priming inside the branch above made the first block of the night
  // look like the page load — so it never chimed.
  primed = true;

  // the countdown itself is for breaks — a bar pinned there all evening for
  // every focus block would just be in the way
  if(!cur || !isBreak(cur.block.kind) || dismissed === activeBlock){
    $('breaktimer').hidden = true;
    return;
  }

  const left = Math.max(0, (cur.to - mins) * 60);
  $('btName').textContent = cur.block.task;
  $('btEnds').textContent = 'ends ' + cur.block.end;
  $('btLeft').textContent = pad(Math.floor(left / 60)) + ':' + pad(Math.floor(left % 60));
  $('breaktimer').hidden = false;
}

tickTimer();
setInterval(tickTimer, 1000);
</script>
</body>
</html>
