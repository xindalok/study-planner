<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>Tonight</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF;
  --panel:#FCF6F8;
  --line:#F9C6D3;
  --line-soft:#FCE4EB;
  --ink:#2B2A5C;
  --muted:#8B86A8;
  --faint:#B39EAC;
  --now:#E24B4A;
  --radius:10px;

  /* subject fills + their own dark text, so labels stay legible on pastel */
  --appdev:#B8E6D5;      --appdev-ink:#0B4436;
  --fund:#C5DEF5;        --fund-ink:#123A5C;
  --cdl:#FBD9A8;         --cdl-ink:#5C3A05;
  --korean:#F9C6D3;      --korean-ink:#72243E;

  /* every draggable thing is at least this tall, so 10-min breaks stay grabbable */
  --min-grab:44px;
  --px-per-min:2;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:'Inter',system-ui,-apple-system,sans-serif;
  font-size:15px;
  line-height:1.45;
  padding:0 0 72px;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:520px;margin:0 auto;padding:0 14px}

/* ---------- header ---------- */
header{padding:20px 0 10px}
.kicker{
  font-family:'JetBrains Mono',monospace;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--muted);margin:0 0 4px
}
h1{
  font-family:'Space Grotesk',sans-serif;
  font-size:28px;font-weight:700;letter-spacing:-.02em;
  margin:0 0 2px
}
.sub{color:var(--muted);font-size:13px;margin:0}

/* ---------- day chips (the reference's coloured headers, doubling as nav) ---------- */
.days{display:flex;gap:6px;padding:14px 0 4px}
.day-tab{
  flex:1 1 0;min-width:0;
  border:2px solid transparent;border-radius:9px;
  padding:7px 4px;cursor:pointer;
  font-family:'JetBrains Mono',monospace;
  font-size:11px;line-height:1.3;font-weight:500;
  text-align:center;white-space:nowrap;overflow:hidden;
  transition:transform .12s,filter .12s;
}
.day-tab b{display:block;font-size:13px;font-weight:600}
.day-tab[aria-selected="true"]{border-color:var(--ink)}
.day-tab.past{opacity:.45}
.day-tab:active{transform:scale(.97)}
.dow-1{background:#C8E6D0;color:#1B4A2C}
.dow-2{background:#D8CCEE;color:#3C3489}
.dow-3{background:#F7CFE1;color:#72243E}
.dow-4{background:#F5C99B;color:#5C3A05}
.dow-5{background:#F7C15E;color:#4A3405}
.dow-6{background:#CFEAF7;color:#0C4453}
.dow-0{background:#A9DCE8;color:#0C4453}

/* ---------- start time ---------- */
.startbar{
  display:flex;align-items:center;gap:10px;
  background:var(--panel);border:1px solid var(--line);
  border-radius:var(--radius);padding:9px 12px;margin:12px 0 2px
}
.startbar[hidden]{display:none}
.startbar label{font-size:12px;color:var(--muted);flex:1}
.startbar input{
  background:var(--paper);border:1px solid var(--line);color:var(--ink);
  font-family:'JetBrains Mono',monospace;font-size:14px;
  border-radius:6px;padding:5px 8px;width:104px
}

/* ---------- the rail ---------- */
.rail{position:relative;margin:16px 0 0;padding-left:48px}
/* A group is one focus block plus the break that follows it. Groups are what
   you drag; the break travels with its block so you can never strand a break
   or end up with two in a row. Tighter gap inside a group than between them,
   so the pairing is visible. */
.group{margin-bottom:9px}
.group:last-child{margin-bottom:0}
.block{
  position:relative;display:flex;align-items:stretch;
  margin-bottom:2px;touch-action:pan-y
}
.block:last-child{margin-bottom:0}
/* the hour gutter: each block carries its own true start time, and a rule
   runs across at every block boundary — heights are not a linear time scale,
   so a fixed hourly grid would drift away from the blocks. */
.block .time{
  position:absolute;left:-48px;top:0;width:40px;text-align:right;
  font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--faint);
  padding-top:3px;letter-spacing:-.02em
}
.block.hour .time{color:var(--muted);font-weight:600}
.block::before{
  content:'';position:absolute;left:-48px;right:0;top:-2px;height:1px;
  background:var(--line-soft)
}
.block.hour::before{background:var(--line)}

.body{
  flex:1;border-radius:8px;
  display:flex;align-items:center;gap:8px;padding:6px 10px;
  min-height:var(--min-grab);overflow:hidden;border:1px solid transparent
}
.block.focus .body{cursor:pointer}
.block[data-subject="Vibecode App Dev"] .body{background:var(--appdev);color:var(--appdev-ink)}
.block[data-subject="Fundamentals (JS/React)"] .body{background:var(--fund);color:var(--fund-ink)}
.block[data-subject="Digital Cloud Leader"] .body{background:var(--cdl);color:var(--cdl-ink)}
.block[data-subject="Korean"] .body{background:var(--korean);color:var(--korean-ink)}

.block.break .body{
  background:transparent;border:1px dashed var(--line);color:var(--faint)
}
.block.break .label{font-size:12px}

/* a gap is time pushed aside by a delay — deliberately empty-looking */
.block.gap .body{
  background:repeating-linear-gradient(135deg,
    transparent 0 6px, rgba(226,75,74,.10) 6px 12px);
  border:1px dashed rgba(226,75,74,.45);color:#A33B3A
}
.block.gap .label{font-size:11px;font-style:italic}

/* live readout of the delay while dragging */
.grip[data-hint]::after{
  content:attr(data-hint);position:absolute;right:48px;
  font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;
  color:var(--ink);background:#fff;border:1px solid var(--line);
  border-radius:6px;padding:2px 6px;white-space:nowrap
}
.grip{position:relative}

.label{flex:1;font-size:13px;font-weight:500;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dur{font-family:'JetBrains Mono',monospace;font-size:10px;opacity:.75;flex:0 0 auto}

.tick{
  flex:0 0 auto;width:18px;height:18px;border-radius:5px;
  border:1.5px solid currentColor;opacity:.4;
  display:grid;place-items:center
}
.tick svg{width:11px;height:11px;stroke:currentColor;stroke-width:3;fill:none;opacity:0}
.block.done .tick{opacity:1;background:rgba(255,255,255,.55)}
.block.done .tick svg{opacity:1}
.block.done .body{filter:saturate(.45)}
.block.done .label{text-decoration:line-through;text-decoration-thickness:1px;opacity:.7}

/* drag grip */
/* 44px is the smallest comfortable touch target; the old 20px grip was
   essentially unhittable with a thumb. touch-action:none here only — the
   block itself keeps pan-y so the page still scrolls normally. */
.grip{
  flex:0 0 auto;width:44px;align-self:stretch;cursor:grab;
  display:grid;place-items:center;touch-action:none;
  margin:-6px -10px -6px 0;border-radius:0 8px 8px 0;
  background:rgba(43,42,92,.06)
}
.grip:active{cursor:grabbing;background:rgba(43,42,92,.14)}
.block.break .grip{background:rgba(43,42,92,.035)}
.grip span{
  display:block;width:14px;height:2px;border-radius:2px;
  background:currentColor;opacity:.5;
  box-shadow:0 -5px 0 currentColor,0 5px 0 currentColor
}
.group.dragging{z-index:20}
.group.dragging .body{box-shadow:0 8px 22px rgba(43,42,92,.22);border-color:var(--ink)}
.rail.reordering .group{transition:transform .16s ease}
.rail.reordering .group.dragging{transition:none}

/* now marker */
.nowline{
  position:absolute;left:-48px;right:0;height:2px;background:var(--now);
  pointer-events:none;z-index:10
}
.nowline::before{
  content:'';position:absolute;left:44px;top:-4px;
  width:9px;height:9px;border-radius:50%;background:var(--now)
}
.nowline span{
  position:absolute;left:0;top:-6px;
  font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--now);
  letter-spacing:.06em;font-weight:600
}

/* ---------- footer / states ---------- */
.summary{
  display:flex;gap:14px;margin:18px 0 0;padding-top:12px;
  border-top:1px solid var(--line);font-size:12px;color:var(--muted);
  font-family:'JetBrains Mono',monospace;flex-wrap:wrap
}
.summary b{color:var(--ink);font-weight:600}
.actions{display:flex;gap:8px;margin-top:14px}
button.ghost{
  background:var(--panel);border:1px solid var(--line);color:var(--muted);
  border-radius:8px;padding:9px 14px;font-size:13px;cursor:pointer;
  font-family:inherit
}
button.ghost:active{background:#F7E9EE}
.msg{
  padding:26px 16px;text-align:center;color:var(--muted);font-size:14px;
  border:1px dashed var(--line);border-radius:var(--radius);margin-top:18px
}
.toast{
  position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(90px);
  background:var(--ink);color:#fff;
  padding:9px 16px;border-radius:999px;font-size:13px;
  transition:transform .22s cubic-bezier(.2,.8,.3,1);z-index:100
}
.toast.show{transform:translateX(-50%) translateY(0)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="kicker" id="kicker">Study planner</p>
    <h1 id="title">Loading</h1>
    <p class="sub" id="subtitle">Fetching your schedule…</p>
  </header>

  <div class="days" id="days" role="tablist"></div>

  <div class="startbar" id="startbar" hidden>
    <label for="startInput" id="startLabel">Start time</label>
    <input type="time" id="startInput">
  </div>

  <div id="content"></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ---------------------------------------------------------------- config
// No URL and no key. This page is served by the Apps Script project itself,
// and google.script.run calls back into it over an already-authenticated
// channel — Google has verified the caller is the owner before the page loads.

// doGet inlines the schedule here, so the timetable renders immediately with
// no network round trip. null only if the server hit an error building it.
const BOOTSTRAP = <?!= bootstrap ?>;

const PX_PER_MIN = 2;
const MIN_GRAB = 44;

// ---------------------------------------------------------------- state
let state = { days: [], today: null, settings: {}, selected: null };

const $ = id => document.getElementById(id);
const content = $('content');

function toast(text){
  const t = $('toast');
  t.textContent = text;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(()=>t.classList.remove('show'), 1800);
}

// ---------------------------------------------------------------- api
/**
 * google.script.run is callback-based, so wrap it in a promise. Server
 * functions throw on failure, which lands in withFailureHandler — hence the
 * {ok,data,error} shape the callers already use.
 */
function call(fn, ...args){
  return new Promise(resolve => {
    google.script.run
      .withSuccessHandler(data => resolve({ok:true, data:data}))
      .withFailureHandler(err => resolve({ok:false, error:String(err && err.message || err)}))
      [fn](...args);
  });
}

const apiGet  = () => call('apiRead');
const apiPost = payload => {
  switch(payload.action){
    case 'setDone':  return call('apiSetDone', payload.id, payload.done);
    case 'reorder':  return call('apiReorder', payload.date, payload.orderedIds);
    case 'setStart': return call('apiSetStart', payload.field, payload.value);
    case 'replan':   return call('apiReplan', payload.date);
    case 'setDelay': return call('apiSetDelay', payload.date, payload.id, payload.minutes);
    default:         return Promise.resolve({ok:false, error:'unknown action'});
  }
};

// ---------------------------------------------------------------- render
function dayById(id){ return state.days.find(d => d.date === id); }

function blockHeight(b){
  return Math.max(MIN_GRAB, b.duration * PX_PER_MIN);
}

const isBreak = k => k === 'short_break' || k === 'long_break';

/**
 * A focus block and the break immediately after it form one group, so a delay
 * applied to a study slot carries its break along. A 'gap' is never absorbed
 * into a group — it is the delay itself, and sits before the block it pushes.
 */
function buildGroups(blocks){
  const groups = [];
  for(let i = 0; i < blocks.length; i++){
    const g = [blocks[i]];
    if(blocks[i].kind === 'focus' && blocks[i+1] && isBreak(blocks[i+1].kind)){
      g.push(blocks[i+1]);
      i++;
    }
    groups.push(g);
  }
  return groups;
}

/** Minutes of gap sitting immediately before this block, 0 if none. */
function gapBefore(blocks, id){
  const i = blocks.findIndex(b => b.id === id);
  if(i > 0 && blocks[i-1].kind === 'gap') return blocks[i-1].duration;
  return 0;
}

function renderTabs(){
  const el = $('days');
  el.innerHTML = '';
  state.days.forEach(d => {
    const dow = new Date(d.date + 'T00:00:00').getDay();
    const b = document.createElement('button');
    b.className = 'day-tab dow-' + dow + (d.date < state.today ? ' past' : '');
    b.setAttribute('role','tab');
    b.setAttribute('aria-selected', String(d.date === state.selected));
    const name = d.weekday.slice(0,3).toUpperCase();
    b.innerHTML = name + '<b>' + Number(d.date.slice(8,10)) + '</b>';
    b.onclick = () => { state.selected = d.date; render(); };
    el.appendChild(b);
  });
}

function renderHeader(day){
  const isToday = day.date === state.today;
  $('kicker').textContent = day.dayType === 'saturday' ? 'Saturday · App Dev only'
    : day.dayType === 'sunday' ? 'Sunday' : 'Weekday';
  $('title').textContent = isToday ? 'Tonight' : day.label;
  const focus = day.blocks.filter(b => b.kind === 'focus');
  const subs = [...new Set(focus.map(b => b.subject))];
  const mins = focus.reduce((a,b)=>a+b.duration,0);
  $('subtitle').textContent = subs.join(' + ') + ' · ' + (mins/60) + 'h of focus';
}

function renderStartBar(day){
  const bar = $('startbar');
  const input = $('startInput');
  const field = day.dayType === 'saturday' ? 'saturdayStart'
    : day.dayType === 'sunday' ? 'sundayStart' : 'weekdayStart';
  bar.hidden = false;
  $('startLabel').textContent =
    field === 'weekdayStart' ? 'Weekdays start at'
    : field === 'saturdayStart' ? 'Saturdays start at' : 'Sundays start at';
  input.value = day.startTime;
  input.onchange = async () => {
    const v = input.value;
    toast('Saving start time…');
    const r = await apiPost({action:'setStart', field: field, value: v});
    if(r.ok){ absorb(r.data); render(); toast('Day starts at ' + v); }
    else toast('Could not save');
  };
}

function blockEl(b, editable, isHourStart){
  const el = document.createElement('div');
  const kindClass = b.kind === 'focus' ? 'focus' : b.kind === 'gap' ? 'gap' : 'break';
  el.className = 'block ' + kindClass
    + (b.done ? ' done' : '') + (isHourStart ? ' hour' : '');
  el.dataset.id = b.id;
  if(b.subject) el.dataset.subject = b.subject;
  el.style.height = blockHeight(b) + 'px';

  const time = document.createElement('div');
  time.className = 'time';
  time.textContent = b.start;
  el.appendChild(time);

  const body = document.createElement('div');
  body.className = 'body';

  if(b.kind === 'focus'){
    const tick = document.createElement('div');
    tick.className = 'tick';
    tick.innerHTML = '<svg viewBox="0 0 24 24"><polyline points="4 13 9 18 20 6"/></svg>';
    body.appendChild(tick);
  }

  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = b.kind === 'gap' ? 'Pushed back ' + b.duration + 'm' : b.task;
  body.appendChild(label);

  const dur = document.createElement('div');
  dur.className = 'dur';
  dur.textContent = b.duration + 'm';
  body.appendChild(dur);

  // Whole block is the check target — a 18px checkbox is a poor tap target,
  // and there is room now that each block is at least 44px tall.
  if(b.kind === 'focus'){
    body.setAttribute('role','button');
    body.setAttribute('tabindex','0');
    body.setAttribute('aria-label', (b.done ? 'Mark not done: ' : 'Mark done: ') + b.task);
    const toggle = async () => {
      const next = !el.classList.contains('done');
      el.classList.toggle('done', next);
      const r = await apiPost({action:'setDone', id:b.id, done:next});
      if(!r.ok){ el.classList.toggle('done', !next); toast('Could not save'); }
    };
    body.onclick = e => { if(!e.target.closest('.grip')) toggle(); };
    body.onkeydown = e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); toggle(); } };
  }

  // Only focus blocks get a grip. Breaks are carried by the block above them,
  // so an independent break handle would just be a way to break the pairing.
  if(editable && b.kind === 'focus'){
    const grip = document.createElement('div');
    grip.className = 'grip';
    grip.setAttribute('aria-label','Drag to reorder ' + b.task + ' and its break');
    grip.innerHTML = '<span></span>';
    body.appendChild(grip);
  }

  el.appendChild(body);
  return el;
}

function renderNowLine(rail, day){
  if(!day || day.date !== state.today) return;
  const now = new Date();
  const mins = now.getHours()*60 + now.getMinutes();
  const blocks = day.blocks;
  const [sh,sm] = day.startTime.split(':').map(Number);
  const startMin = sh*60+sm;
  const total = blocks.reduce((a,b)=>a+b.duration,0);
  if(mins < startMin || mins > startMin + total) return;

  const els = [...rail.querySelectorAll('.block')];
  let acc = startMin;
  for(let i=0;i<blocks.length;i++){
    const b = blocks[i];
    if(mins >= acc && mins < acc + b.duration){
      const el = els[i];
      if(!el) return;
      // interpolate inside the block's *rendered* height, which is not a
      // linear time scale once a short break is padded to --min-grab
      const frac = (mins - acc) / b.duration;
      const line = document.createElement('div');
      line.className = 'nowline';
      line.innerHTML = '<span>NOW</span>';
      line.style.top = (el.offsetTop + el.offsetHeight * frac) + 'px';
      rail.appendChild(line);
      return;
    }
    acc += b.duration;
  }
}

function renderSummary(day){
  const focus = day.blocks.filter(b=>b.kind==='focus');
  const done = focus.filter(b=>b.done).length;
  const div = document.createElement('div');
  div.className = 'summary';
  div.innerHTML =
    '<div><b>' + done + '/' + focus.length + '</b> done</div>' +
    '<div><b>' + (done*30/60).toFixed(1) + 'h</b> logged</div>' +
    '<div>ends <b>' + day.blocks[day.blocks.length-1].end + '</b></div>';
  return div;
}

function render(){
  const day = dayById(state.selected) || dayById(state.today) || state.days[0];
  if(!day){
    content.innerHTML = '<div class="msg">No schedule yet. Run firstTimeSetup in Apps Script, then refresh.</div>';
    return;
  }
  state.selected = day.date;
  renderTabs();
  renderHeader(day);
  renderStartBar(day);

  content.innerHTML = '';
  const rail = document.createElement('div');
  rail.className = 'rail';
  rail.id = 'rail';
  rail.dataset.date = day.date;

  const editable = day.date >= state.today;
  let lastHour = -1;
  buildGroups(day.blocks).forEach(group => {
    const g = document.createElement('div');
    g.className = 'group';
    group.forEach(b => {
      const hour = Number(b.start.slice(0,2));
      const isHourStart = hour !== lastHour;
      lastHour = hour;
      g.appendChild(blockEl(b, editable, isHourStart));
    });
    // dragging the grip delays this group and everything below it
    const grip = g.querySelector('.grip');
    if(grip){
      const lead = group[0];
      attachDelay(grip, g, day.date, lead.id, gapBefore(day.blocks, lead.id));
    }
    rail.appendChild(g);
  });
  content.appendChild(rail);
  renderNowLine(rail, day);
  content.appendChild(renderSummary(day));

  const actions = document.createElement('div');
  actions.className = 'actions';
  if(editable){
    const rb = document.createElement('button');
    rb.className = 'ghost';
    rb.textContent = 'Reset this day';
    rb.onclick = async () => {
      if(!confirm('Rebuild this day from the template? Check-offs and order are cleared.')) return;
      toast('Rebuilding…');
      const r = await apiPost({action:'replan', date:day.date});
      if(r.ok){ absorb(r.data); render(); toast('Day rebuilt'); }
      else toast('Could not rebuild');
    };
    actions.appendChild(rb);
  }
  const refresh = document.createElement('button');
  refresh.className = 'ghost';
  refresh.textContent = 'Refresh';
  refresh.onclick = load;
  actions.appendChild(refresh);
  content.appendChild(actions);
}

// ---------------------------------------------------------------- drag to reorder
const SNAP_MIN = 5;   // delays land on 5-minute boundaries

/**
 * Drag the grip to delay this group and everything below it. Blocks above are
 * never touched — they keep their transforms at zero throughout.
 *
 * The DOM is deliberately not mutated while dragging. An earlier version
 * called insertBefore() mid-drag, which detaches the dragged subtree —
 * including the grip holding pointer capture — and removing a capturing
 * element releases the capture, so pointermove stopped firing. Here everything
 * is previewed with transforms and committed once on release, and the
 * listeners live on window so nothing depends on capture surviving.
 */
function attachDelay(grip, el, date, blockId, currentGap){
  let rail=null, below=[], startY=0, mins=currentGap, moved=false;

  // Drag distance converts to minutes at the same scale the blocks are drawn,
  // then snaps. Clamped at zero: you can drag up to cancel a delay, but a
  // block can never start earlier than its natural place in the day.
  const minutesFor = dy =>
    Math.max(0, Math.round((currentGap + dy / PX_PER_MIN) / SNAP_MIN) * SNAP_MIN);

  const onMove = e => {
    const dy = e.clientY - startY;
    if(Math.abs(dy) > 4) moved = true;
    mins = minutesFor(dy);
    const px = (mins - currentGap) * PX_PER_MIN;
    below.forEach(n => { n.style.transform = 'translateY(' + px + 'px)'; });
    grip.dataset.hint = mins ? '+' + mins + 'm' : '0';
  };

  const onUp = async () => {
    window.removeEventListener('pointermove', onMove);
    window.removeEventListener('pointerup', onUp);
    window.removeEventListener('pointercancel', onUp);

    el.classList.remove('dragging');
    rail.classList.remove('reordering');
    below.forEach(n => { n.style.transform = ''; });
    delete grip.dataset.hint;

    if(!moved || mins === currentGap) return;

    toast(mins ? 'Delaying ' + mins + 'm…' : 'Clearing delay…');
    const r = await apiPost({action:'setDelay', date: date, id: blockId, minutes: mins});
    if(r.ok){
      absorb(r.data); render();
      toast(mins ? 'Pushed back ' + mins + 'm' : 'Delay cleared');
    } else {
      toast('Could not save'); load();
    }
  };

  grip.addEventListener('pointerdown', e => {
    e.preventDefault();
    e.stopPropagation();
    rail = el.parentElement;
    const groups = [...rail.children].filter(n => n.classList.contains('group'));
    const i = groups.indexOf(el);
    if(i < 0) return;
    below = groups.slice(i);   // this group and everything after it, only
    startY = e.clientY;
    mins = currentGap;
    moved = false;
    el.classList.add('dragging');
    rail.classList.add('reordering');
    window.addEventListener('pointermove', onMove);
    window.addEventListener('pointerup', onUp);
    window.addEventListener('pointercancel', onUp);
  });
}

// ---------------------------------------------------------------- boot
function absorb(data){
  state.days = data.days;
  state.today = data.today;
  state.settings = data.settings;
  if(!state.selected) state.selected = data.today;
}

async function load(){
  try{
    const r = await apiGet();
    if(!r.ok){ content.innerHTML = '<div class="msg">' + r.error + '</div>'; return; }
    absorb(r.data);
    render();
  }catch(err){
    content.innerHTML = '<div class="msg">Couldn\'t refresh: ' + err + '</div>';
  }
}

// First paint comes from the inlined data — no waiting on the network.
// load() is only for the Refresh button and for the error fallback.
if(BOOTSTRAP && BOOTSTRAP.days){
  absorb(BOOTSTRAP);
  render();
}else{
  load();
}

setInterval(() => {
  const r = $('rail');
  if(!r) return;
  const d = dayById(state.selected);
  const old = r.querySelector('.nowline');
  if(old) old.remove();
  renderNowLine(r, d);
}, 60000);
</script>
</body>
